[package]
name = "auto-commit"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities"]
homepage = "https://github.com/v3xlabs/auto-commit"
repository = "https://github.com/v3xlabs/auto-commit"
description = "Automagically generate commit messages."
authors = [
    "Miguel Piedrafita <soy@miguelpiedrafita.com>",
    "Luc van Kampen <luc.van.kampen@ethereum.org>",
]

[dependencies]
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "native-tls", "byot"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
indicatif = "0.18"
crossterm = "0.29"
inquire = "0.9"
owo-colors = { version = "4", features = ["supports-colors"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
toml = "1"

[build-dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
clap_mangen = "0.3"

[profile.release]
lto = true
strip = true
codegen-units = 1
